[package]
name = "gravography-app"
description = "Gravography interactive black-hole viewer and headless render CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "gravography"
path = "src/main.rs"

[dependencies]
gravography-physics.workspace = true
gravography-sky.workspace = true
gravography-render.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"

[lints]
workspace = true

[dev-dependencies]
approx = "0.5.1"
