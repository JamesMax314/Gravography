[package]
name = "gravography-render"
description = "Rendering backends for Gravography: CPU f64 reference renderer and wgpu GPU renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
gravography-physics.workspace = true
gravography-sky.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "exr", "hdr"] }
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
wgpu = "30.0.1"

[lints]
workspace = true

[dev-dependencies]
approx = "0.5.1"
